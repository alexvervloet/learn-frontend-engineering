# Included, not inherited, and that distinction is the whole reason this file
# exists.
#
# nginx's `add_header` does NOT merge across levels. A location block that
# declares any `add_header` of its own discards every `add_header` from its
# parent. So a server-level Content-Security-Policy plus a
# `location = /index.html { add_header Cache-Control ...; }` means index.html
# is served with a cache header and **no CSP at all**, silently, with a 200.
#
# This bit the CI smoke test for this image: the page served correctly, the
# deep link worked, and the CSP was missing from exactly the one response
# anybody would look at.
#
# So the headers live here and every location that sets a header of its own
# includes this file as well.

# The policy here and `baselineCsp()` in src/lib/security.ts are two copies of
# one decision: that function is what the lesson teaches and tests, this is
# what the container serves. Two copies drift, so
# src/lessons/02_security.test.tsx reads this file and compares them, and
# `connect-src` is the one directive allowed to differ, because the served
# policy has no third-party API in it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS: after one visit over https, the browser refuses to speak http to this
# host at all, for the given duration. That closes the redirect a
# man-in-the-middle can intercept, which is the one a redirect from http to
# https still leaves open on a first visit.
#
# Two warnings, because this header is the one that cannot be taken back.
#
#   max-age is a promise the browser keeps even if you change your mind. Ship
#   it with a short max-age first and raise it once you are sure every
#   subdomain has a certificate.
#
#   includeSubDomains covers hosts you may not be thinking about. A legacy
#   http-only admin panel on a subdomain stops loading, for everyone who has
#   visited the main site, until its max-age expires.
#
# `preload` is deliberately absent. Adding it asks browser vendors to hard-code
# this domain, and removal takes months.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
