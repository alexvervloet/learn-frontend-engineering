# Included, not inherited, and that distinction is the whole reason this file
# exists.
#
# nginx's `add_header` does NOT merge across levels. A location block that
# declares any `add_header` of its own discards every `add_header` from its
# parent. So a server-level Content-Security-Policy plus a
# `location = /index.html { add_header Cache-Control ...; }` means index.html
# is served with a cache header and **no CSP at all**, silently, with a 200.
#
# This bit the CI smoke test for this image: the page served correctly, the
# deep link worked, and the CSP was missing from exactly the one response
# anybody would look at.
#
# So the headers live here and every location that sets a header of its own
# includes this file as well.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
