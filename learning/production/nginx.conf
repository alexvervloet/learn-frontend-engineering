# Serving a single-page app. Four things here are not optional.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # 1. The SPA fallback. Any path that is not a real file returns index.html,
  #    so a deep link and a refresh work. Without it, /products/keyboard is a
  #    404 on reload and works fine when navigated to, which is a confusing
  #    bug report.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 2. Hashed assets are immutable and cached forever. The filename changes
  #    when the content does, so there is no invalidation problem.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # 3. index.html is never cached. It is the file that points at the hashed
  #    assets, so caching it is how users get last week's app pointing at
  #    assets that no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # 4. Security headers. The CSP is the one from lesson 02; the rest are
  #    one-liners with no downside.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Source maps are uploaded to the error tracker at deploy time, not served.
  # See lesson 04: `sourcemap: "hidden"` stops the comment being emitted, and
  # this stops the files being reachable even if one is copied in by accident.
  location ~ \.map$ {
    return 404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Do not advertise the version to anyone scanning for known bugs.
  server_tokens off;
}
