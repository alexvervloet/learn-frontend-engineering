# Serving a single-page app. Five things here are not optional.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # 5. Security headers, in an included file rather than written here.
  #
  #    `add_header` does not merge across levels: a location that declares one
  #    of its own discards every `add_header` from the server block. Both
  #    cache-control locations below do exactly that, so each has to include
  #    the headers again. Writing them once at server level looks right, works
  #    for most paths, and silently drops them from index.html.
  include /etc/nginx/conf.d/security-headers.conf;

  # 1. The SPA fallback. Any path that is not a real file returns index.html,
  #    so a deep link and a refresh work. Without it, /products/keyboard is a
  #    404 on reload and works fine when navigated to, which is a confusing
  #    bug report.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 2. Hashed assets are immutable and cached forever. The filename changes
  #    when the content does, so there is no invalidation problem.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # 3. index.html is never cached. It is the file that points at the hashed
  #    assets, so caching it is how users get last week's app pointing at
  #    assets that no longer exist.
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # 4. Source maps are uploaded to the error tracker at deploy time, not
  #    served. `sourcemap: "hidden"` in vite.config.ts stops the comment being
  #    emitted; this stops the files being reachable even if one is copied in
  #    by accident.
  location ~ \.map$ {
    return 404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Do not advertise the version to anyone scanning for known bugs.
  server_tokens off;
}
