# The repo's own CI.
#
# Three jobs rather than one. `check` is seconds and gives a clear signal before
# the slower jobs finish; `test` is the one that catches a lesson whose claims
# have stopped being true; `build` catches the things that only break in a
# production bundle, which for a frontend repo is most of them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the latest run per branch matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # --max-warnings 0 on purpose. A warning nobody has to fix is a warning
      # everybody stops reading, and the react-hooks rules here are the ones
      # worth failing a build over.
      - run: npm run lint -- --max-warnings 0
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one Node version failing alone is useful information
      matrix:
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # The browser suite. Separate, because it is the only job that downloads a
  # browser, and because a styling regression should be distinguishable from a
  # unit-test failure at a glance.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Chromium only. The other two engines roughly triple the download for
      # tests that are about layout and the cascade, not about engine quirks.
      - run: npm run e2e:install -w learning/testing
      # Playwright starts the dev servers itself; see
      # learning/testing/playwright.config.ts.
      - run: npm run e2e -w learning/testing
      # The Next module has its own suite, against a production build rather
      # than a dev server, because streaming and caching only behave correctly
      # there.
      - run: npm run e2e -w learning/next-app-router
      # Astro's suite checks the claim the framework rests on: a page with a
      # React component on it and zero script responses.
      - run: npm run e2e -w learning/astro-islands
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            learning/testing/playwright-report/
            learning/next-app-router/playwright-report/
            learning/astro-islands/playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # `npm ci` honours the allowScripts block in package.json, so esbuild gets
      # its binary. If a dependency bump ever re-blocks it, this job is where it
      # shows up, as a Vite command failing for no visible reason.
      - run: npm run build

  # The production module ships a Dockerfile and an nginx config, and its
  # tests assert what those files say rather than that they work. Building the
  # image here is what turns that into a checked claim: a broken base image,
  # a wrong workspace path or a missing file fails the build.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://api.example.com \
            --build-arg VITE_COMMIT_SHA=${GITHUB_SHA::7} \
            -f learning/production/Dockerfile \
            -t frontend:${GITHUB_SHA::7} .
      - name: Check it serves the built app
        run: |
          set -x
          docker run -d --name frontend -p 8080:8080 frontend:${GITHUB_SHA::7}

          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/ -o /tmp/index.html && break
            sleep 1
          done

          # A container that exits on startup otherwise looks like thirty
          # identical connection-refused lines and nothing about the cause.
          if [ ! -s /tmp/index.html ]; then
            echo "--- container logs ---"
            docker logs frontend || true
            exit 1
          fi

          echo "--- what it served ---"
          head -c 400 /tmp/index.html; echo

          # The real markup, not a fallback page.
          grep -q 'id="root"' /tmp/index.html

          # The SPA fallback: a deep link that is not a file returns the app.
          deep=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/some/deep/link)
          [ "$deep" = "200" ] || { echo "deep link returned $deep"; exit 1; }

          # The security headers from nginx.conf.
          curl -sI http://localhost:8080/ | tee /tmp/headers.txt
          grep -qi 'content-security-policy' /tmp/headers.txt

          # Source maps are uploaded to the error tracker, never served.
          maps=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/nothing.map)
          [ "$maps" = "404" ] || { echo "a .map returned $maps"; exit 1; }

          docker rm -f frontend
