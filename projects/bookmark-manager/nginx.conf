server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # `add_header` does not merge across levels: a location that sets one of
  # its own discards every header from the parent. Each location below that
  # sets a cache header therefore includes these again. See the LESSONS
  # entry; this was a missing CSP on index.html, served with a 200.
  include /etc/nginx/conf.d/security-headers.conf;

  # The SPA fallback. Without it /bookmarks/2 is a 404 on refresh and works
  # fine when navigated to, which is a baffling bug report.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Never cached: it points at the hashed assets, so a cached copy asks for
  # files that no longer exist.
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # The mock Service Worker. Caching it would pin a build's fake API in place
  # across deploys.
  location = /mockServiceWorker.js {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Source maps go to the error tracker, never to a visitor.
  location ~ \.map$ {
    return 404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server_tokens off;
}
